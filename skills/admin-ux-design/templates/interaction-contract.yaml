  - interaction: REPLACE_WITH_STABLE_INTERACTION_ID
    given: REPLACE_WITH_START_STATE
    when: REPLACE_WITH_ACTION_SEQUENCE
    then: REPLACE_WITH_OBSERVABLE_RESULT

approval:
  evidence: null
  scope: []
